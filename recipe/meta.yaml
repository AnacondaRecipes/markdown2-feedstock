{% set name = "markdown2" %}
{% set version = "2.5.3" %}
{% set sha256 = "4d502953a4633408b0ab3ec503c5d6984d1b14307e32b325ec7d16ea57524895" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  entry_points:
    - markdown2 = markdown2:main
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - setuptools
  run:
    - python
  run_constrained:
    # code_syntax_highlighting
    - pygments >=2.7.3

test:
  imports:
    - markdown2
  requires:
    - pip
  commands:
    - pip check
    - markdown2 --help

about:
  home: https://github.com/trentm/python-markdown2
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: fast and complete Python implementation of Markdown
  description: |
    Markdown is a text-to-HTML filter; it translates an easy-to-read / easy-to-write structured
    text format into HTML.
  doc_url: https://github.com/trentm/python-markdown2/blob/master/README.md
  dev_url: https://github.com/trentm/python-markdown2

extra:
  recipe-maintainers:
    - jakirkham
    - pelson
